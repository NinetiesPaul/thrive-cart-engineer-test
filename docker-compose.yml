version: '3.7'
services:
  php:
    container_name: webschool_php
    build: .
    ports:
     - "8015:80"
     - "443:443"
    volumes:
     - .:/var/www/html
    links:
     - mysql

  mysql:
    container_name: webschool_mysql
    image: mysql:5.7
    ports:
      - "33060:3306"
    volumes:
      - dbdata:/var/lib/mysql
    environment:
     - MYSQL_PASSWORD=root
     - MYSQL_ROOT_PASSWORD=root
     - MYSQL_DATABASE=webschool

  node:
    container_name: webschool_node
    build:
      context: .
      dockerfile: Dockerfile.node
    working_dir: /app
    volumes:
      - .:/app
      - node_modules_data:/app/node_modules
    command: sh -c "npm install && npm run build:js"

volumes:
  dbdata:
  node_modules_data:
