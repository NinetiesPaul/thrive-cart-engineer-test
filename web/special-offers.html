<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
        <meta charset="UTF8">
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
        {CSS}
        {JS}
        <script src="../includes/js/special-offer.js"></script>
        <title>ACMEStore :: Home Page</title>
    </head>
    <body>
        <nav class="navbar navbar-expand-md navbar-dark bg-dark fixed-top">
            <a class="navbar-brand" href="home">ACMEStore</a>
            <div class="collapse navbar-collapse" id="navbarsExampleDefault">
                <ul class="navbar-nav mr-auto">
                    <li class="nav-item dropdown">
                        <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button" data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
                            Logged in as customer
                        </a>
                        <div class="dropdown-menu" aria-labelledby="navbarDropdown">
                            <a class="dropdown-item" href="/">Logout</a>
                            <!-- <a class="dropdown-item" href="#">Another action</a>
                            <div class="dropdown-divider"></div>
                            <a class="dropdown-item" href="#">Something else here</a> -->
                        </div>
                    </li>
                </ul>
            </div>
        </nav>
        
        <div class="text-center menu" style="width: 20%; float: left;  background-color: slategray;">
            <div style="padding: 2em;">
                <a href="/" class="btn btn-light btn btn-block">Home</a>
            </div>
        </div>

        <div class="" style="width: 80%; float: right; padding: 2em;">
            <form id="specialOffersForm" method="post" role="form" class="form-horizontal" action="/special-offers">
                <div class="form-group row col-md-2">
                    <label for="code">Product</label>
                    <select class="form-control" id="code" name="code">
                        <option value="">Select a code</option>
                        {PRODUCTS}
                    </select>
                </div>
                <div class="form-group row col-md-2">
                    <label for="onEveryNItems">On Every N Items
                    <input type="number" class="form-control" id="onEveryNItems" name="onEveryNItems" value="2" min="2"></label>
                </div>
                <div class="form-group row col-md-2">
                    <label for="discountRate">Discount Rate
                    <input type="number" class="form-control" id="discountRate" name="discountRate" value="0.5" min="0.01" max="0.99" step="0.01" ></label>
                </div>
                <div class="form-group row col-md-2">
                    <button type="submit" class="btn btn-primary"><span class='glyphicon glyphicon-plus' required></span> Create Special Offer</button>
                </div>
            </form>

            <hr/>
    
            <h1>Special Offers</h1>
            {SPECIAL_OFFERS}
        </div>

        <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/js/bootstrap.min.js" integrity="sha384-ChfqqxuZUCnJSK3+MXmPNIyE6ZbWh2IMqE241rYiqJxyMiZ6OW/JmZQ5stwEULTy" crossorigin="anonymous"></script>
    </body>
</html>
